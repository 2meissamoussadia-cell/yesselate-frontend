# HPA indicatif – P19 Bench & Capacity Planning
# Adapter namespace, deploy, métriques et min/max selon l’env (staging, prod).
# Scale sur CPU ; alternative : custom metrics (RPS/pod, P95) si exposés.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-dashboard
  namespace: yessalate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-dashboard
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
